[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "task-manager-cli"
version = "0.1.0"
description = "Administrador de tareas desde terminal con subcomandos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
task = "task:main"
